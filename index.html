<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空衣大揭密</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --space:#0b1630; --panel:#eaf6ff; --card:#ffffff; --ink:#1d2a44; --muted:#5d6d8a;
  --flame:#ffb000; --hot:#ff5a1f; --done:#2f9e6f; --factbg:#fff3cf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--panel);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--panel:#16233f;--card:#1e2d4d;--ink:#eef4ff;--muted:#a9b8d2;--factbg:#3a3320;}
}
:root[data-theme="dark"]{--panel:#16233f;--card:#1e2d4d;--ink:#eef4ff;--muted:#a9b8d2;--factbg:#3a3320;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,40%);height:100%}
.figure{position:relative;background:var(--space);container-type:size;display:grid;place-items:center;overflow:hidden}
.stars{position:absolute;inset:0;width:100%;height:100%}
.suitwrap{position:relative;width:min(100cqw,calc(100cqh * 600 / 900));aspect-ratio:600/900}
.suitwrap svg{display:block;width:100%;height:100%}
[data-part]{cursor:pointer;transition:filter .2s}
[data-part].on{filter:drop-shadow(0 0 6px #ffb000) drop-shadow(0 0 14px #ffb000)}
.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,6.2cqh,58px);height:clamp(34px,6.2cqh,58px);border-radius:50%;
  border:4px solid #1d2a44;background:#ffb000;color:#1d2a44;font:inherit;font-weight:bold;font-size:clamp(18px,3.4cqh,32px);line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.spot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid #ffb000;opacity:0;animation:ping 1.8s infinite}
.spot.seen{background:#2f9e6f;color:#fff}
.spot.seen::after{animation:none}
.spot.cur{background:#ff5a1f;color:#fff;outline:4px solid #fff;outline-offset:2px}
.spot:focus-visible{outline:5px solid #fff;outline-offset:3px}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.spot::after{animation:none}[data-part]{transition:none}}
.side{display:flex;flex-direction:column;gap:1rem;padding:1.4rem 1.6rem;overflow:auto;min-height:0}
.head h1{font-size:clamp(1.8rem,3.4vw,3rem);margin:0;line-height:1.2}
.head p{margin:.3rem 0 0;font-size:clamp(1rem,1.6vw,1.3rem);color:var(--muted)}
.progress{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.dots{display:flex;gap:.35rem;list-style:none;margin:0;padding:0}
.dots li{width:clamp(14px,1.6vw,22px);height:clamp(14px,1.6vw,22px);border-radius:50%;border:3px solid var(--ink)}
.dots li.seen{background:var(--done);border-color:var(--done)}
.count{font-size:clamp(1rem,1.6vw,1.3rem)}
.info{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem}
.info h2{margin:0;font-size:clamp(1.6rem,3vw,2.6rem);line-height:1.25}
.info .body{margin:0;font-size:clamp(1.15rem,2vw,1.7rem);line-height:1.6}
.fact{background:var(--factbg);border-radius:18px;padding:.8rem 1rem}
.fact h3{margin:0 0 .2rem;font-size:clamp(1rem,1.6vw,1.3rem);color:var(--hot)}
.fact p{margin:0;font-size:clamp(1.05rem,1.8vw,1.45rem);line-height:1.55}
.actions{display:flex;gap:.6rem;flex-wrap:wrap}
button.btn,a.btn{font:inherit;font-size:clamp(1rem,1.6vw,1.25rem);color:var(--ink);background:transparent;border:3px solid var(--ink);border-radius:999px;padding:.4em 1.1em;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--flame);color:#1d2a44;border-color:#1d2a44}
.btn[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.btn:focus-visible{outline:4px solid var(--flame);outline-offset:3px}
.done-card{display:none;background:var(--done);color:#fff;border-radius:22px;padding:1rem 1.3rem}
.done-card.show{display:block}
.done-card p{margin:0 0 .7rem;font-size:clamp(1.15rem,2vw,1.6rem);line-height:1.5}
.done-card .btn{border-color:#fff;color:#1d2a44;background:#fff}
.hidden{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55% 45%}
  .side{padding:1rem}
}
</style>
</head>
<body>
<div class="app">
  <div class="figure">
    <svg class="stars" id="stars" aria-hidden="true"></svg>
    <div class="suitwrap" id="wrap">
      <svg viewBox="0 0 600 900" role="img" aria-label="太空人穿著登月太空衣的正面圖">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#e3a43a"/><stop offset="1" stop-color="#9c5c17"/>
          </linearGradient>

        </defs>
        <g stroke="#1d2a44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

          <!-- backpack -->

            <rect x="172" y="205" width="256" height="345" rx="28" fill="#d7dbe0"/>
            <rect x="205" y="178" width="190" height="44" rx="14" fill="#c4cad2"/>
            <line x1="420" y1="250" x2="420" y2="330" stroke-width="3"/>

          <!-- legs -->

            <path d="M248 560 L236 800" stroke="#f7f5ef" stroke-width="94" fill="none"/>
            <path d="M352 560 L364 800" stroke="#f7f5ef" stroke-width="94" fill="none"/>
            <path d="M200 700 Q241 712 282 700 M200 722 Q241 734 282 722 M318 700 Q359 712 400 700 M318 722 Q359 734 400 722" fill="none" stroke-width="3" stroke="#9aa3ad"/>
          </g>
          <g data-part="stripes">
            <path d="M248 560 L236 800" pathLength="100" stroke="#e0473c" stroke-width="94" stroke-dasharray="0 30 7 200" stroke-linecap="butt" fill="none"/>
            <path d="M352 560 L364 800" pathLength="100" stroke="#e0473c" stroke-width="94" stroke-dasharray="0 30 7 200" stroke-linecap="butt" fill="none"/>
          </g>

          <!-- cooling garment cutaway -->
          <g data-part="cooling">
            <g clip-path="url(#cut)" stroke="none">
              <rect x="333" y="618" width="66" height="96" fill="#cfd6df"/>
              <rect x="341" y="618" width="58" height="96" fill="#e9e3d2"/>
              <rect x="349" y="618" width="50" height="96" fill="#a8c3dc"/>
              <rect x="357" y="618" width="42" height="96" fill="#f3e1c7"/>
              <path d="M360 622 q8 8 0 16 q-8 8 0 16 q8 8 0 16 q-8 8 0 16 q8 8 0 16 M376 622 q8 8 0 16 q-8 8 0 16 q8 8 0 16 q-8 8 0 16 q8 8 0 16 M391 622 q8 8 0 16 q-8 8 0 16 q8 8 0 16 q-8 8 0 16 q8 8 0 16" fill="none" stroke="#2f7fd8" stroke-width="4"/>
            </g>
            <rect x="333" y="618" width="66" height="96" rx="16" fill="none" stroke-dasharray="8 6"/>
          </g>

          <!-- boots -->
          <g data-part="boots">
            <path d="M188 790 L284 790 L292 852 Q292 866 278 866 L182 866 Q166 866 170 850 Z" fill="#e9ecef"/>
            <path d="M316 790 L412 790 L430 850 Q434 866 418 866 L322 866 Q308 866 308 852 Z" fill="#e9ecef"/>
            <rect x="166" y="862" width="130" height="20" rx="8" fill="#4a5263"/>
            <rect x="304" y="862" width="130" height="20" rx="8" fill="#4a5263"/>
            <path d="M184 866 v16 M202 866 v16 M220 866 v16 M238 866 v16 M256 866 v16 M274 866 v16 M322 866 v16 M340 866 v16 M358 866 v16 M376 866 v16 M394 866 v16 M412 866 v16" stroke="#8b95a1" stroke-width="3"/>
            <path d="M196 812 H280 M320 812 H404" stroke="#9aa3ad" stroke-width="3"/>
          </g>

          <!-- torso -->
          <g data-part="suit">
            <path d="M172 330 Q300 298 428 330 L436 560 Q300 596 164 560 Z" fill="#f7f5ef"/>
            <path d="M168 545 Q300 580 432 545" fill="none" stroke-width="3" stroke="#9aa3ad"/>
          </g>

          <!-- arms -->
          <g data-part="suit">
            <path d="M196 352 C150 385 138 470 136 582" fill="none" stroke-width="72"/>
            <path d="M404 352 C450 385 462 470 464 582" fill="none" stroke-width="72"/>
            <path d="M196 352 C150 385 138 470 136 582" fill="none" stroke="#f7f5ef" stroke-width="62"/>
            <path d="M404 352 C450 385 462 470 464 582" fill="none" stroke="#f7f5ef" stroke-width="62"/>
            <path d="M112 488 Q138 498 166 490 M434 490 Q462 498 488 488" fill="none" stroke-width="3" stroke="#9aa3ad"/>
          </g>
          <g data-part="stripes">
            <path d="M196 352 C150 385 138 470 136 582" pathLength="100" fill="none" stroke="#e0473c" stroke-width="62" stroke-dasharray="0 22 9 200" stroke-linecap="butt"/>
            <path d="M404 352 C450 385 462 470 464 582" pathLength="100" fill="none" stroke="#e0473c" stroke-width="62" stroke-dasharray="0 22 9 200" stroke-linecap="butt"/>
          </g>

          <!-- gloves -->
          <g data-part="gloves">
            <ellipse cx="136" cy="590" rx="36" ry="11" fill="#9fb3c8"/>
            <ellipse cx="464" cy="590" rx="36" ry="11" fill="#9fb3c8"/>
            <path d="M108 600 Q104 650 120 668 L156 668 Q170 646 164 600 Z" fill="#c3cad3"/>
            <path d="M436 600 Q430 646 444 668 L480 668 Q496 650 492 600 Z" fill="#c3cad3"/>
            <path d="M118 664 v20 M130 666 v24 M142 666 v24 M154 664 v20 M446 664 v20 M458 666 v24 M470 666 v24 M482 664 v20" stroke-width="10"/>
            <path d="M118 678 v6 M130 682 v8 M142 682 v8 M154 678 v6 M446 678 v6 M458 682 v8 M470 682 v8 M482 678 v6" stroke="#4a5263" stroke-width="8"/>
            <path d="M162 612 q16 6 12 30" fill="none" stroke-width="10"/>
            <path d="M438 612 q-16 6 -12 30" fill="none" stroke-width="10"/>
          </g>

          <!-- wrist checklist -->
          <g data-part="checklist">
            <rect x="104" y="518" width="64" height="48" rx="6" fill="#fff6d6"/>
            <path d="M114 534 h44 M114 544 h36 M114 554 h40" stroke-width="3" stroke="#5d6d8a"/>
            <path d="M116 518 v-6 M128 518 v-6 M140 518 v-6 M152 518 v-6" stroke-width="3"/>
          </g>

          <!-- neck ring -->
          <g data-part="suit"><ellipse cx="300" cy="314" rx="86" ry="20" fill="#9fb3c8"/></g>

          <!-- chest control box -->
          <g data-part="control">
            <rect x="246" y="372" width="108" height="66" rx="10" fill="#b8c1cc"/>
            <circle cx="270" cy="398" r="10" fill="#4a5263"/>
            <circle cx="300" cy="398" r="10" fill="#4a5263"/>
            <circle cx="330" cy="398" r="10" fill="#e0473c"/>
            <path d="M262 422 h76" stroke-width="3"/>
          </g>

          <!-- hoses -->
          <g data-part="hoses">
            <circle cx="232" cy="478" r="17" fill="#9aa6b4"/><circle cx="232" cy="478" r="7" fill="#2f7fd8"/>
            <circle cx="276" cy="478" r="17" fill="#9aa6b4"/><circle cx="276" cy="478" r="7" fill="#e0473c"/>
          </g>

          <!-- mission patch -->
          <g data-part="suit">
            <circle cx="372" cy="410" r="26" fill="#1d2a44"/>
            <circle cx="380" cy="402" r="9" fill="#e9e7e1" stroke="none"/>
            <path d="M360 424 l12 -22 l4 4 z" fill="#ffb000" stroke="none"/>
          </g>

          <!-- helmet -->
          <g data-part="helmet">
            <circle cx="300" cy="212" r="104" fill="#f4f3ee"/>
            <path d="M206 170 Q300 80 394 170" fill="none" stroke="#e0473c" stroke-width="16"/>
            <ellipse cx="300" cy="224" rx="74" ry="64" fill="url(#gold)"/>
            <ellipse cx="270" cy="198" rx="22" ry="11" fill="rgba(255,255,255,.7)" stroke="none" transform="rotate(-25 270 198)"/>
            <path d="M206 250 Q300 300 394 250" fill="none" stroke="#c4cad2" stroke-width="6"/>

        </g>
      </svg>
    </div>
  </div>

  <div class="side">
    <div class="head">
      <h1>太空衣大揭密</h1>
      <p>登月之前，先認識太空人的裝備。點一點圓點或太空衣的各個部位。</p>
    </div>
    <div class="progress">
      <ol class="dots" id="dots" aria-hidden="true"></ol>
      <span class="count" id="count"></span>
    </div>
    <div class="done-card" id="doneCard">
      <p>十個裝備全部認識了！太空衣穿好了，準備出發去發射台吧！</p>
      <a class="btn" id="goMoon" href="moon-mission.html">出發去登月</a>
    </div>
    <section class="info" id="info" aria-live="polite">
      <h2 id="title">從哪裡開始呢？</h2>
      <p class="body" id="body">太空衣上有好幾個橘色圓點，每一個都是一種裝備。點一點，看看它有什麼功用！</p>
      <div class="fact hidden" id="factBox"><h3>你知道嗎？</h3><p id="fact"></p></div>
      <div class="actions">
        <button class="btn" id="listen">聽一聽</button>
        <button class="btn primary" id="next">下一個</button>
        <button class="btn" id="voice" aria-pressed="true">語音旁白</button>
      </div>
    </section>
  </div>
</div>
<script>
(()=>{
"use strict";
const ITEMS=[
  {id:'helmet',x:300,y:222,title:'頭盔和金色面罩',
   body:'頭盔像一個透明的大泡泡，裡面充滿氧氣，讓太空人可以呼吸。外面再蓋上一層金色面罩，擋住很強的陽光。頭盔裡還戴著通訊帽，有耳機和麥克風，可以和夥伴說話。',
   fact:'金色面罩上鍍了一層薄薄的真金！金子很會反光，可以保護太空人的眼睛。'},
  {id:'backpack',x:430,y:290,title:'維生背包',
   body:'背包是太空人的「生命小工廠」：送出氧氣、清除呼出來的二氧化碳、讓冷卻水流動，還有無線電可以通話。',
   fact:'整套太空衣加上背包，在地球上大約 90 公斤重。到了月球，因為重力只有六分之一，感覺只像 15 公斤！'},
  {id:'control',x:252,y:376,title:'胸前控制盒',
   body:'掛在胸前的按鈕盒，太空人用手就能操作。可以調整氧氣、冷卻水和無線電的音量。',
   fact:'按鈕和旋鈕都做得很大，因為太空人戴著厚厚的手套，也要按得到。'},
  {id:'hoses',x:254,y:505,title:'氧氣管接頭',
   body:'肚子前面有兩個接頭，可以接上管子。一個把新鮮氧氣送進太空衣，另一個把用過的空氣送出去。',
   fact:'在太空船裡，管子接在太空船上；要走到月球表面時，就改接到維生背包。'},
  {id:'stripes',x:150,y:440,title:'紅色條紋',
   body:'指令長的手臂、腿和頭盔上有紅色條紋。大家的太空衣都長得一樣，有了條紋，一看就知道誰是指令長。',
   fact:'這個方法從阿波羅 13 號任務開始使用。等一下登月時，看看紅色條紋的太空人是誰！'},
  {id:'checklist',x:104,y:520,title:'手腕上的檢查清單',
   body:'手腕上綁著一本小冊子，寫著要做的工作和步驟。太空人翻一翻，就知道下一步要做什麼。',
   fact:'就像我們的聯絡簿和工作清單，一步一步照著做，就比較不會忘記。'},
  {id:'gloves',x:464,y:640,title:'手套',
   body:'手套要包得很緊，空氣才不會漏出去。指尖是軟軟的橡膠，讓太空人摸東西時比較有感覺。',
   fact:'太空衣裡充滿了氣，手套會像氣球一樣鼓鼓的。握拳要很用力，手很快就會痠。'},
  {id:'suit',x:240,y:650,title:'很多層的太空衣',
   body:'太空衣有二十多層，像好幾件衣服疊在一起。它能保持衣服裡的空氣，也能擋住太熱、太冷，還有太空中飛來的小石頭。',
   fact:'月球的白天可以超過攝氏 100 度，晚上會冷到零下 170 度左右！'},
  {id:'cooling',x:400,y:622,title:'水冷衣（剖開來看）',
   body:'太空衣最裡面，穿著一件像緊身衣的「水冷衣」，上面縫著很多細細的水管。冷水流過全身，把熱帶走。',
   fact:'在月球上走路和工作很累，會一直流汗，所以需要水冷衣幫忙降溫。'},
  {id:'boots',x:230,y:830,title:'月球靴',
   body:'太空人在太空衣的靴子外面，再套上一雙月球靴。鞋底有一條一條的紋路，走在月球的灰塵上比較不會滑倒。',
   fact:'月球上那些有名的腳印，就是這雙靴子踩出來的！'}
];
const wrap=document.getElementById('wrap'),dots=document.getElementById('dots'),countEl=document.getElementById('count');
const tEl=document.getElementById('title'),bEl=document.getElementById('body'),fEl=document.getElementById('fact'),factBox=document.getElementById('factBox');
const doneCard=document.getElementById('doneCard');
const seen=new Set();let cur=null,voiceOn=true;

// stars
const st=document.getElementById('stars');
st.setAttribute('viewBox','0 0 100 100');st.setAttribute('preserveAspectRatio','none');
let sh='';for(let i=0;i<120;i++){sh+=`<circle cx="${(Math.random()*100).toFixed(2)}" cy="${(Math.random()*100).toFixed(2)}" r="${(Math.random()*.18+.06).toFixed(2)}" fill="#fff" opacity="${(Math.random()*.6+.3).toFixed(2)}"/>`;}
st.innerHTML=sh;

// speech
let zh=null;
function pick(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();zh=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null;}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick;}
function say(text){if(!voiceOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[「」（）]/g,' '));u.lang='zh-TW';if(zh)u.voice=zh;u.rate=.92;speechSynthesis.speak(u);}

// hotspots
const spots={};
ITEMS.forEach(it=>{
  const b=document.createElement('button');b.className='spot';b.type='button';
  b.style.left=(it.x/600*100)+'%';b.style.top=(it.y/900*100)+'%';
  b.textContent='+';b.setAttribute('aria-label',it.title);
  b.onclick=()=>select(it.id);
  wrap.appendChild(b);spots[it.id]=b;
  const li=document.createElement('li');li.dataset.id=it.id;dots.appendChild(li);
});
document.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.part)));

function select(id){
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  cur=id;seen.add(id);
  document.querySelectorAll('[data-part]').forEach(el=>el.classList.toggle('on',el.dataset.part===id));
  ITEMS.forEach(i=>{const b=spots[i.id];b.classList.toggle('seen',seen.has(i.id));b.classList.toggle('cur',i.id===id);b.textContent=seen.has(i.id)?'✓':'+';});
  [...dots.children].forEach(li=>li.classList.toggle('seen',seen.has(li.dataset.id)));
  tEl.textContent=it.title;bEl.textContent=it.body;fEl.textContent=it.fact;factBox.classList.remove('hidden');
  updateCount();
  say(it.title+'。'+it.body+' 你知道嗎？'+it.fact);
  if(seen.size===ITEMS.length&&!doneCard.classList.contains('show')){doneCard.classList.add('show');doneCard.scrollIntoView({block:'nearest'});}
}
function updateCount(){countEl.textContent=`已經認識 ${seen.size} / ${ITEMS.length} 個裝備`;}
updateCount();
// 放在 GitHub Pages 或本機時連到同資料夾的 moon-mission.html；在 Claude 預覽裡則改連已發布的登月頁面
(function(){const h=location.hostname;if(location.protocol!=='file:'&&!/github\.io$/i.test(h)){const g=document.getElementById('goMoon');g.href='https://claude.ai/artifact/2oLVrosfxj5ygtRkFwS4Ae';g.target='_blank';g.rel='noopener';}})();
document.getElementById('next').onclick=()=>{
  const idx=ITEMS.findIndex(i=>i.id===cur);
  let nx=ITEMS.find(i=>!seen.has(i.id));
  if(!nx)nx=ITEMS[(idx+1)%ITEMS.length];
  select(nx.id);spots[nx.id].focus({preventScroll:true});
};
document.getElementById('listen').onclick=()=>{
  if(!cur){say(tEl.textContent+'。'+bEl.textContent);return;}
  const it=ITEMS.find(i=>i.id===cur);const was=voiceOn;voiceOn=true;say(it.title+'。'+it.body+' 你知道嗎？'+it.fact);voiceOn=was;
};
const vb=document.getElementById('voice');
vb.onclick=()=>{voiceOn=!voiceOn;vb.setAttribute('aria-pressed',voiceOn);if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel();};
})();
</script>
